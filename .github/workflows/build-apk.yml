name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Laravel API base URL"
        required: false
        default: "https://exchenge.narailexpress.net"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Scaffold platform files (keep our pubspec and lib)
        run: |
          # Back up files we do not want flutter create to overwrite.
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          if [ ! -d "android" ]; then
            flutter create --project-name exchenge_mobile --platforms=android .
          fi
          # Restore our sources and dependencies.
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib_backup lib
          # Release builds need INTERNET permission in the main manifest.
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$manifest"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          fi
          grep -n "INTERNET" "$manifest"
          flutter pub get

      - name: Read app version
        id: version
        run: |
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release --dart-define=API_BASE=${{ github.event.inputs.api_base || 'https://exchenge.narailexpress.net' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchenge-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Exchenge Mobile ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
