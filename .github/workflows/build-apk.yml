name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Laravel API base URL"
        required: false
        default: "https://exchenge.narailexpress.net"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Scaffold platform files (keep our pubspec and lib)
        run: bash .github/scripts/prepare_android.sh

      - name: Read app version
        id: version
        run: |
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release --dart-define=API_BASE=${{ github.event.inputs.api_base || 'https://exchenge.narailexpress.net' }}

      - name: Verify release signing (refuse debug-signed APK)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          CERT=""
          BT=$(ls -d "${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            CERT=$("$BT/apksigner" verify --print-certs "$APK" 2>&1 || true)
          fi
          if [ -z "$CERT" ] && [ -n "${JAVA_HOME:-}" ]; then
            CERT=$("$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" 2>&1 || true)
          fi
          echo "$CERT"
          if echo "$CERT" | grep -qi "CN=Android Debug"; then
            echo "::error::APK is signed with the DEBUG key - refusing to publish"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: exchenge-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Exchenge Mobile ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
