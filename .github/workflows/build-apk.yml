name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_base:
        description: "Laravel API base URL"
        required: false
        default: "https://exchenge.narailexpress.net"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Scaffold missing platform files
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name exchenge_mobile --platforms=android .
          fi
          flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --dart-define=API_BASE=${{ github.event.inputs.api_base || 'https://exchenge.narailexpress.net' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exchenge-mobile-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
